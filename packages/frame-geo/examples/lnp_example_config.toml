# Example configuration for LNP generation
# This demonstrates all available parameters for frame-geo

[metadata]
name = "lnp_example_generation"
description = "LNP structure generation with all features"
random_seed = 42

[structure]
type = "lnp"  # Structure type (currently only "lnp" is supported)

# ============================================
# GRID CONFIGURATION
# ============================================
[grid]
nx = 128              # Grid size in x direction (voxels)
ny = 128              # Grid size in y direction (voxels)
nz = 128              # Grid size in z direction (voxels)
dx_nm = 1.0           # Voxel size in x direction (nanometers)
dy_nm = 1.0           # Voxel size in y direction (nanometers)
dz_nm = 1.0           # Voxel size in z direction (nanometers)

# ============================================
# GENERATION PARAMETERS
# ============================================
[generation]
num_samples = 1000            # Number of valid structures to generate
library_name = "lnp_1k_10ch_lhs"       # Name for the generated library (managed by LibraryManager)
parallel_workers = 1          # Number of parallel workers (-1 = auto-detect, uses CPU count - 1)
max_retries_per_sample = 250   # Max attempts to generate a valid structure
flush_batch_size = 100         # Write to disk every N structures (memory efficiency)

# Latin Hypercube Sampling (LHS) for uniform priors
# Options: false (default), true, "standard", or "maximin"
# - false: Use standard random sampling from PyMC
# - true or "standard": Use standard LHS for all Uniform distributions
# - "maximin": Use maximin-optimized LHS for better space-filling coverage
# Note: Only Uniform distributions use LHS; other distributions (e.g., Beta) are sampled independently
sample_uniform_lhs = "maximin"

# ============================================
# OUTPUT CONFIGURATION
# ============================================
# Note: Libraries are now managed by frame-core's LibraryManager
# Output will be written to frame_data/libraries/{uuid}/
[output]
save_parametric = true         # Save parametric representations
save_voxelized = true          # Save voxelized grids
save_validation_logs = true    # Save validation statistics
save_statistics = true         # Save parameter statistics

# ============================================
# PRIORS (Statistical distributions for parameters)
# ============================================

# Shell1 (outer bilayer shell - always present)
[priors.shell1_radius_nm]
distribution = "Uniform"
lower = 10.0
upper = 50.0

[priors.shell1_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.shell1_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

# Shell2 (optional inner bilayer shell)
[priors.shell2_probability]
distribution = "Beta"
alpha = 2.0
beta = 2.0             # Beta(2,2) has mean 0.5, giving ~50% chance of having shell2

[priors.shell2_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.shell2_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

# Payload particles (spherical particles inside the shells)
[priors.payload_core_radius_nm]
distribution = "Uniform"
lower = 5.0
upper = 20.0

[priors.payload_shell_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.payload_shell_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

# Packing fraction determines how many payloads fit
[priors.payload_packing_fraction]
distribution = "Uniform"
lower = 0.2
upper = 0.6

# Blebs (surface protrusions on shell1)
[priors.target_num_blebs]
distribution = "Uniform"
lower = 0.0               # Average number of blebs
upper = 10.0

[priors.bleb_shell_radius_nm]
distribution = "Uniform"
lower = 5.0
upper = 20.0

[priors.bleb_shell_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.bleb_shell_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

# ============================================
# VALIDATION
# ============================================
[validation]
enabled = true

[validation.rules]
geometric_feasibility = true
volume_conservation = true
grid_bounds = true
shell_nesting = true
payload_clearance = true
bleb_placement = true
minimum_thickness = true

# ============================================
# VOXELIZATION
# ============================================
[voxelization]
method = "hybrid"  # "analytical", "sampling", or "hybrid"

[voxelization.hybrid]
use_analytical_for_simple = true
monte_carlo_samples_per_voxel = 1000

# Channel assignments for material types
[voxelization.channels]
shell1_head = 0
shell1_tail = 1
shell2_head = 2
shell2_tail = 3
payload_core = 4
payload_head = 5
payload_tail = 6
bleb_head = 7
bleb_tail = 8
water = 9

# ============================================
# VISUALIZATION (optional)
# ============================================
[visualization]
enabled = false
generate_on_completion = false
num_samples_to_visualize = 5

[visualization.options]
show_wireframe = false
show_surface = false
cross_section_views = ["xy", "xz", "yz"]
output_format = "interactive"  # "interactive" or "png"

