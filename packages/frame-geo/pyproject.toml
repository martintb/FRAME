[project]
name = "frame-geo"
version = "0.1.0"
description = "Stochastic geometry generator for FRAME digital twins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pymc>=5.0.0",
    "pytensor>=2.0.0",
    "zarr>=2.16.0",
    "pandas>=2.0.0",
    "pyvista>=0.42.0",
    "matplotlib>=3.7.0",
    "tomli>=2.0.0",
    "tqdm>=4.65.0",
    "frame-voxel",
]

[project.scripts]
frame-geo = "frame_geo.cli:main"

[tool.uv.sources]
frame-voxel = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
