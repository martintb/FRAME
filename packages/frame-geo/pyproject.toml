[project]
name = "frame-geo"
version = "0.1.0"
description = "Stochastic geometry generator for FRAME digital twins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    # "torch==2.6.0+cu124",
    "torch>2",
    "pymc",
    "pytensor",
    "scipy",
    "zarr",
    "pandas",
    "pyvista",
    "matplotlib",
    "tomli",
    "tqdm",
    "frame-core",
]

[project.scripts]
frame-geo = "frame_geo.cli:main"

[tool.uv.sources]
frame-core = { workspace = true }
# torch = { index = "pytorch-cu124" }

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]
