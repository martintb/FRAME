[project]
name = "frame-core"
version = "0.1.0"
description = "Core data management, storage, and experiment tracking for the FRAME digital twin framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "napari",
    "numpy>=2",
    "optuna-dashboard",
    "pandas",
    "pyarrow",
    "pyqt6",
    "pyvista",
    # "torch==2.6.0+cu124",
    "torch>2",
    "zarr",
    "tensorboard",
]

[project.scripts]
frame = "frame.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
# torch = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame"]

