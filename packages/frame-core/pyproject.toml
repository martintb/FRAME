[project]
name = "frame-core"
version = "0.1.0"
description = "Foundation for data representation, storage, and visualization of multi-channel 3D voxel grids"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "napari>=0.6.5",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pyqt6>=6.9.1",
    "pyvista>=0.46.3",
    "torch>=2.8.0",
    "zarr>=3.1.3",
]


[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
