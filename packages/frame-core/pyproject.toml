[project]
name = "frame-core"
version = "0.1.0"
description = "Core data management, storage, and experiment tracking for the FRAME digital twin framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "napari>=0.6.5",
    "numpy>=2.3.3",
    "optuna-dashboard>=0.17.0",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "pyqt6>=6.9.1",
    "pyvista>=0.46.3",
    "torch>=2.8.0",
    "zarr>=3.1.3",
    "tensorboard>=2.15.0",
]

[project.scripts]
frame = "frame.cli:main"

[tool.uv]
package = true

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame"]

