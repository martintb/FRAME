[project]
name = "frame-twin"
version = "0.1.0"
description = "Diffusion-based digital twin for 3D voxel structure generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    #"torch==2.6.0+cu124",
    "torch>2",
    "frame-core", # Workspace dependency
    "numpy",
    "tomli",
    "pydantic",
    "tensorboard",
    "tqdm",
    "scikit-learn", # For stratified splitting
    "optuna", # For hyperparameter optimization
]

[project.scripts]
frame-twin = "frame_twin.cli:main"

[tool.uv.sources]
frame-core = { workspace = true }
# torch = { index = "pytorch-cu124" }

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
