[project]
name = "frame-twin"
version = "0.1.0"
description = "Diffusion-based digital twin for 3D voxel structure generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "frame-core", # Workspace dependency
    "numpy>=1.24",
    "tomli>=2.0",
    "pydantic>=2.0",
    "tensorboard>=2.12",
    "tqdm>=4.65",
    "scikit-learn>=1.3", # For stratified splitting
]

[project.scripts]
frame-twin = "frame_twin.cli:main"

[tool.uv.sources]
frame-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
