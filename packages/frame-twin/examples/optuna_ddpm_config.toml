# [search_space.unet_channels]
# type = "categorical"
# choices = [[32, 64, 128, 256], [48, 96, 192, 384], [64, 128, 256, 512]]
#
# OR use scalar base channels with default multipliers [1, 2, 4, 8]:
# [search_space.unet_channels]
# type = "categorical"
# choices = [32, 48, 64]  # Results in [32,64,128,256], [48,96,192,384], [64,128,256,512]

# [search_space.timesteps]
# type = "categorical"
# choices = [500, 1000, 2000]

# [search_space.optimizer]
