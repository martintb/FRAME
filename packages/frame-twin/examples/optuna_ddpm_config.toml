# min = 0.0
# max = 0.3
# log = false

# [search_space.grad_clip]
# type = "float"
# min = 0.5
# max = 2.0
# log = false

# [search_space.scheduler]
# type = "categorical"
# choices = ["cosine", "step", "none"]

# With 10+ parameters, expect ~150-200 trials for good coverage
