# Inference Configuration for frame-twin
# This config generates new structures using trained VAE and DDPM models

[metadata]
name = "lnp_structure_generation"
description = "Generate new LNP structures with parameter conditioning"
random_seed = 42

[model]
vae_checkpoint = "./checkpoints/vae/best_model.pt"
ddpm_checkpoint = "./checkpoints/ddpm/best_model.pt"
conditioning_strategy = "concat"

[sampling]
num_samples = 100
ddpm_steps = 1000
eta = 0.0  # DDPM sampling parameter (0.0 = DDPM, 1.0 = DDIM)
device = "auto"  # Device for inference: "auto", "cuda", "mps", or "cpu"

[conditioning]
# Specify known parameters (use empty string for mask tokens)
shell1_radius_nm = 35.0
shell1_head_thickness_nm = ""  # Will use mask token
shell1_tail_thickness_nm = ""
shell2_probability = ""
shell2_head_thickness_nm = ""
shell2_tail_thickness_nm = ""
payload_core_radius_nm = ""
payload_shell_head_thickness_nm = ""
payload_shell_tail_thickness_nm = ""
payload_packing_fraction = ""
target_num_blebs = ""
bleb_shell_radius_nm = ""
bleb_shell_head_thickness_nm = ""
bleb_shell_tail_thickness_nm = ""

[output]
output_path = "./generated_structures"
save_voxels = true
save_parameters = true
