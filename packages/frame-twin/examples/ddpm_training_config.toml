# DDPM Training Configuration for frame-twin
# This config trains a DDPM model conditioned on structural parameters

[metadata]
name = "lnp_ddpm_concat_training"
description = "DDPM training with concatenation conditioning for LNP structures"
random_seed = 42

[data]
voxel_library_path = "./output/lnp/voxels.zarr"
split_strategy = "random"
train_ratio = 0.8
val_ratio = 0.1
test_ratio = 0.1

[model]
type = "ddpm"
conditioning_strategy = "concat"  # "concat", "cross_attention", or "adaptive_norm"
vae_checkpoint = "./checkpoints/vae/best_model.pt"  # Direct path to checkpoint
# Alternative: use experiment UUID (and optionally a specific trial)
# vae_experiment_uuid = "exp_abc123"  # VAE experiment UUID
# vae_trial_uuid = "trial_xyz789"  # Optional: specific trial within the VAE experiment
freeze_vae = true

[model.ddpm]
latent_channels = 32
timesteps = 1000
beta_schedule = "linear"  # or "cosine"
unet_channels = [32, 64, 128, 256]
attention_resolutions = [8, 16]

[model.conditioning]
# For concatenation strategy
param_embedding_dim = 128
# For cross-attention strategy (uncomment if using cross_attention)
# num_attention_heads = 8
# num_attention_layers = 4
# For adaptive normalization strategy (uncomment if using adaptive_norm)
# use_adaptive_group_norm = true

[training]
device = "cuda"
distributed = false
num_epochs = 200
batch_size = 8
learning_rate = 1e-4
optimizer = "adam"
scheduler = "cosine"

[loss]
loss_type = "mse"  # "mse" or "mae"

[checkpointing]
output_dir = "./checkpoints/ddpm"
save_every_epochs = 20
save_every_minutes = 120
keep_last_n = 3
save_best = true

[logging]
log_every_steps = 100
tensorboard_dir = "./logs/ddpm"
