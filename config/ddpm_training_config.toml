# DDPM Training Configuration for frame-twin
# This config trains a DDPM model conditioned on structural parameters

[metadata]
name = "lnp_ddpm_concat_training"
description = "DDPM training with concatenation conditioning for LNP structures"
random_seed = 42

[data]
voxel_library_path = "./output/lnp_5k_10ch/voxels.zarr"
split_strategy = "random"
train_ratio = 0.8
val_ratio = 0.1
test_ratio = 0.1

[model]
type = "ddpm"
conditioning_strategy = "concat"  # "concat", "cross_attention", or "adaptive_norm"
vae_checkpoint = "./output/lnp_5k_10ch/checkpoints_v2/unet_vae_5k_3l_l8_b16/best_model.pt"
freeze_vae = true
latent_channels = 8
timesteps = 1000
beta_schedule = "linear"  # or "cosine"
unet_channels = [16, 32, 64, 128]
attention_resolutions = [8, 16]

[model.conditioning]
# For concatenation strategy
param_embedding_dim = 128
# For cross-attention strategy (uncomment if using cross_attention)
# num_attention_heads = 8
# num_attention_layers = 4
# For adaptive normalization strategy (uncomment if using adaptive_norm)
# use_adaptive_group_norm = true

[training]
device = "mps"
distributed = false
num_epochs = 200
num_workers = 0
batch_size = 2
learning_rate = 2e-4
optimizer = "adam"
scheduler = "cosine"

[loss]
loss_type = "mse"  # "mse" or "mae"

[checkpointing]
output_dir = "./output/lnp_5k_10ch/checkpoints_v2/ddpm_unetvae_concat"
save_every_epochs = 1
save_every_minutes = 60
keep_last_n = 3
save_best = true

[logging]
log_every_steps = 25
tensorboard_dir = "./output/lnp_5k_10ch/logs_v2/ddpm_unetvae_concat"
n_recon_compare = 25  # Log generated samples every N steps
