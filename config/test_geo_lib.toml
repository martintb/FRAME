# Test configuration for frame-geo with LibraryManager
[metadata]
name = "test_geo_lib"
description = "Test library-managed generation"
random_seed = 42

[structure]
type = "lnp"

[grid]
nx = 64
ny = 64
nz = 64
dx_nm = 1.0
dy_nm = 1.0
dz_nm = 1.0

[generation]
num_samples = 5
library_name = "test_geo_lib"
parallel_workers = 1
max_retries_per_sample = 100
flush_batch_size = 10
sample_uniform_lhs = false

[output]
save_parametric = true
save_voxelized = false  # Disable for faster testing
save_validation_logs = true
save_statistics = true

# Priors
[priors.shell1_radius_nm]
distribution = "Uniform"
lower = 10.0
upper = 50.0

[priors.shell1_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.shell1_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

[priors.shell2_probability]
distribution = "Beta"
alpha = 2.0
beta = 2.0

[priors.shell2_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.shell2_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

[priors.payload_core_radius_nm]
distribution = "Uniform"
lower = 5.0
upper = 20.0

[priors.payload_shell_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.payload_shell_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

[priors.payload_packing_fraction]
distribution = "Uniform"
lower = 0.2
upper = 0.6

[priors.target_num_blebs]
distribution = "Uniform"
lower = 0.0
upper = 10.0

[priors.bleb_shell_radius_nm]
distribution = "Uniform"
lower = 5.0
upper = 20.0

[priors.bleb_shell_head_thickness_nm]
distribution = "Uniform"
lower = 0.8
upper = 1.2

[priors.bleb_shell_tail_thickness_nm]
distribution = "Uniform"
lower = 2.5
upper = 4.0

[validation]
enabled = true

[validation.rules]
geometric_feasibility = true
volume_conservation = true
grid_bounds = true
shell_nesting = true
payload_clearance = true
bleb_placement = true
minimum_thickness = true

[voxelization]
method = "hybrid"

[voxelization.hybrid]
use_analytical_for_simple = true
monte_carlo_samples_per_voxel = 1000

[voxelization.channels]
shell1_head = 0
shell1_tail = 1
shell2_head = 2
shell2_tail = 3
payload_core = 4
payload_head = 5
payload_tail = 6
bleb_head = 7
bleb_tail = 8
water = 9
