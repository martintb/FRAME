[metadata]
name = "vp_hvae_lnp_10k_standard_prior"
random_seed = 42

[data]
library_uuid = "lib_44f814b8fc99"
split_strategy = "random"
train_ratio = 0.8
val_ratio = 0.1
test_ratio = 0.1

# Data augmentation
random_crop_size = 64  # Train on random 64^3 crops
random_rotation = true  # Apply random 90-degree rotations and flips
reject_bg_only_crops = true  # Skip crops that contain only background voxels
bg_channel_name = "water"  # Background channel identified by name
max_bg_crop_attempts = 32  # Retry random crops up to this many times

[model]
type = "vp_hvae"
input_channels = 10
prior_type = "vamp"  # Options: "vamp" (mixture prior) or "standard" (Normal(0,I))
z1_size = 32
z2_size = 32
vampprior_num_components = 32
vampprior_init_strategy = "random"
input_type = "fractional"
input_resolution = 64  # Training resolution (matches random_crop_size)
use_gating = false  # Use gated layers (false for standard ReLU layers, ~50% fewer params)

[training]
device = "mps"
num_epochs = 200
batch_size = 16
learning_rate = 0.0002
optimizer = "adam"
scheduler = "cosine"
num_workers = 0
grad_clip = 1.0

# KL annealing parameters - linear warmup matching reference implementation
kl_warmup_epochs = 200  # Linear warmup over 100 epochs (matches VampPrior reference)
kl_annealing_strategy = "linear"  # "linear" for one-time warmup (reference uses this)

[loss]
reconstruction_type = "fractional_ce"
reconstruction_weight = 1.0
kl_weight = 0.001
label_smoothing = 0.025  # Optional fractional CE label smoothing
bg_weight = 0.0        # Optional background penalty weight for empty voxels

[loss.channel_weights]
shell1_head = 10
shell1_tail = 10
shell2_head = 10
shell2_tail = 10
payload_core = 10
payload_head = 10
payload_tail = 10
bleb_head = 10
bleb_tail = 10
water = 0.01

[checkpointing]
experiments_dir = "/Users/tbm/frame_data/experiments"
save_every_epochs = 1
save_every_minutes = 60
keep_last_n = 10
save_best = true

[logging]
log_every_steps = 25
n_recon_compare = 25
n_analyze_latent = 250
max_latent_analysis_samples = 32
