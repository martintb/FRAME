[metadata]
name = "vp_hvae_lnp_10k"
random_seed = 42

[data]
library_uuid = "lib_44f814b8fc99"
split_strategy = "random"
train_ratio = 0.8
val_ratio = 0.1
test_ratio = 0.1

# Data augmentation
random_crop_size = 64  # Train on random 64^3 crops
random_rotation = true  # Apply random 90-degree rotations and flips
reject_water_only_crops = true  # Skip crops that contain only water/background
water_channel_index = 9  # Treat the 10th channel (0-based index 9) as water/background
max_water_crop_attempts = 32  # Retry random crops up to this many times

[model]
type = "vp_hvae"
input_channels = 10
z1_size = 16
z2_size = 16
vampprior_num_components = 32
vampprior_init_strategy = "random"
input_type = "fractional"
input_resolution = 64  # Training resolution (matches random_crop_size)

[training]
device = "mps"
num_epochs = 200
batch_size = 16
learning_rate = 0.0005
optimizer = "adam"
scheduler = "cosine"
num_workers = 0
grad_clip = 1.0

# KL annealing parameters - linear warmup matching reference implementation
kl_warmup_epochs = 100  # Linear warmup over 100 epochs (matches VampPrior reference)
kl_annealing_strategy = "linear"  # "linear" for one-time warmup (reference uses this)

[loss]
reconstruction_weight = 1.0
kl_weight = 1.0

[checkpointing]
experiments_dir = "/Users/tbm/frame_data/experiments"
save_every_epochs = 1
save_every_minutes = 60
keep_last_n = 10
save_best = true

[logging]
log_every_steps = 25
n_recon_compare = 25
n_analyze_latent = 250
max_latent_analysis_samples = 32
