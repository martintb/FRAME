# VAE Training Configuration for frame-twin
# Optimized to prevent posterior collapse and enable sampling
#
# Key improvements:
# - Higher KL weight (0.005 vs 0.001) to prevent latent space collapse
# - Faster KL warmup (5 epochs) for short training runs
# - Free bits constraint ensures all latent dimensions stay active
# - Increased model capacity (48 base channels) for better representation
# - Edge loss for sharper reconstructions
# - AdamW optimizer for better generalization

[metadata]
name = "lnp_vae_crop_fracce_freebits"
description = "VAE training with crop and fractional cross-entropy loss for LNP compression + generation"
random_seed = 42

[data]
library_uuid = "lib_454c2a20e77b"  # lnp_5k_10ch library
split_strategy = "random"  # or "stratified"
train_ratio = 0.8
val_ratio = 0.1
test_ratio = 0.1
# stratify_params = ["shell1_radius_nm", "shell2_probability"]  # for stratified splitting

# Data augmentation
random_crop_size = 64  # Train on random 64^3 crops
random_rotation = true  # Apply random 90-degree rotations and flips

[model]
type = "vae"  # "vae" or "unet_vae"
input_channels = 10  # Number of material channels
latent_channels = 16  # Small latent space dimension
channel_schedule = [16, 32, 64]  # Channel sizes at each level (inferred levels = 2)
# Alternatively, use legacy params: base_channels = 32, levels = 2
norm_groups = 8  # Number of groups for GroupNorm (UNetVAE only)

[training]
device = "mps"  # "cuda", "mps", or "cpu"
distributed = false  # Set true for DDP
num_epochs = 100
num_workers = 0
batch_size = 32  # May need to reduce to 2-3 due to larger base_channels
learning_rate = 2e-4
optimizer = "adamw"  # AdamW for better generalization
scheduler = "cosine"  # "cosine", "step", or "none"
grad_clip = 1.0  # Gradient clipping value (0 to disable)
kl_warmup_epochs = 20  # Fast warmup (was 15) - full KL weight by epoch 5

[loss]
reconstruction_weight = 1.0
kl_weight = 1.0  # 5x stronger (was 0.001) to prevent collapse
free_bits = 0.5  # Minimum KL per latent dimension (prevents per-dim collapse)
reconstruction_type = "fractional_ce"  # "mse" | "l1" | "bce_logits"
mask_threshold = 0.0
bg_weight = 0.0
edge_weight = 0.0  # Small edge loss for sharper boundaries (was 0.0)
label_smoothing = 0.0

[checkpointing]
experiments_dir = "/Users/tbm/frame_data/experiments"  # Base directory for experiments
save_every_epochs = 1  # More frequent saving for short runs
save_every_minutes = 60  # Time-based checkpointing
keep_last_n = 10
save_best = true  # Save best validation loss

[logging]
log_every_steps = 25
n_recon_compare = 25  # More frequent reconstruction comparisons
